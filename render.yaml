services:
  # Backend Express API Service
  - type: web
    name: multivendor-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_URL
        value: "*"

  # Frontend React Client Static Site
  - type: static
    name: multivendor-store
    rootDir: ecommerce-platform
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://multivendor-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
